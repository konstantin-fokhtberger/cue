name: Pull request quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            delay_seconds=$((attempt * 10))
            echo "Dependency installation failed; retrying in ${delay_seconds}s."
            sleep "$delay_seconds"
          done

      - name: Run full quality gate
        run: npm run quality:full

  package-macos-arm64:
    name: package-macos-arm64
    needs: quality
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify runner architecture
        run: test "$(uname -m)" = "arm64"

      - name: Install locked dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            delay_seconds=$((attempt * 10))
            echo "Dependency installation failed; retrying in ${delay_seconds}s."
            sleep "$delay_seconds"
          done

      - name: Run native Swift structural and mutation gates
        run: npm run test:swift && npm run test:swift:mutation

      - name: Package and verify ad-hoc macOS application
        run: npm run pack:ci

      - name: Run packaged Electron audio diagnostics E2E
        run: npm run test:e2e:packaged
